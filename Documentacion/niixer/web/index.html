<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nexus: Protocolo de emergencia — versión web</title>
  <link rel="icon" href="TemplateData/favicon.ico">
  <style>
    /* Página para incrustar el juego en un iframe (artículo de Niixer) o abrirlo solo.
       El juego ocupa todo el espacio disponible conservando la proporción 16:9. */
    html, body { margin: 0; height: 100%; background: #05080b; overflow: hidden;
                 font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #cfe9f2; }
    #marco { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #pantalla { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
    #pantalla:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; }
    canvas { display: block; width: 100%; height: 100%; outline: none; background: #000; }
    .capa { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 2.2vmin; text-align: center; }
    #portada { background: #000 url("poster.jpg") center / cover no-repeat; cursor: pointer; }
    #portada::before { content: ""; position: absolute; inset: 0;
                       background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.65)); }
    #portada > * { position: relative; }
    #jugar { border: 1px solid #5fe3f5; color: #e8fbff; background: rgba(8, 40, 50, .55);
             font-size: clamp(14px, 3.4vmin, 26px); letter-spacing: .35em; padding: 1.2vmin 3.6vmin;
             cursor: pointer; text-shadow: 0 0 8px #3fd7ee; }
    #jugar:hover { background: rgba(20, 90, 110, .7); }
    .nota { font-size: clamp(11px, 1.9vmin, 15px); color: #9fb8c2; max-width: 80%; line-height: 1.45; }
    #carga { display: none; background: #000; }
    #carga .titulo { font-size: clamp(16px, 4vmin, 34px); letter-spacing: .6em; color: #e8fbff; }
    #barra { width: 46%; height: 3px; background: #12303a; }
    #barra > div { width: 0; height: 100%; background: #5fe3f5; box-shadow: 0 0 10px #5fe3f5; transition: width .2s; }
    #porcentaje { font-size: clamp(11px, 2vmin, 15px); letter-spacing: .25em; color: #7fd3e3; }
    #error { display: none; background: rgba(0,0,0,.85); color: #ff8a80; padding: 0 8%; }
    #completa { position: absolute; right: 1.2vmin; bottom: 1.2vmin; display: none; z-index: 5;
                border: 1px solid rgba(95, 227, 245, .6); background: rgba(0, 0, 0, .55); color: #cfe9f2;
                font-size: 12px; letter-spacing: .12em; padding: 6px 10px; cursor: pointer; }
    #completa:hover { background: rgba(20, 90, 110, .8); }
  </style>
</head>
<body>
  <div id="marco">
    <div id="pantalla">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="portada" class="capa">
        <button id="jugar" type="button">JUGAR</button>
        <div class="nota">Descarga de unos 70 MB · Teclado y ratón, mando o pantalla táctil<br>
          Use el botón PANTALLA COMPLETA (abajo a la derecha) para jugar mejor</div>
      </div>
      <div id="carga" class="capa">
        <div class="titulo">NEXUS</div>
        <div id="barra"><div></div></div>
        <div id="porcentaje">CARGANDO 0 %</div>
      </div>
      <div id="error" class="capa"></div>
      <button id="completa" type="button" title="Pantalla completa">⛶ PANTALLA COMPLETA</button>
    </div>
  </div>
  <script>
    const pantalla = document.getElementById("pantalla");
    const canvas = document.getElementById("unity-canvas");
    const portada = document.getElementById("portada");
    const carga = document.getElementById("carga");
    const barra = document.querySelector("#barra > div");
    const porcentaje = document.getElementById("porcentaje");
    const botonCompleta = document.getElementById("completa");
    let iniciado = false;

    function mostrarError(texto) {
      const e = document.getElementById("error");
      e.textContent = texto; e.style.display = "flex"; carga.style.display = "none";
    }

    // Pantalla completa sobre el contenedor (el iframe debe tener allowfullscreen)
    botonCompleta.onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (pantalla.requestFullscreen) pantalla.requestFullscreen().catch(() => window.open(location.href, "_blank"));
      else window.open(location.href, "_blank");
    };

    function iniciar() {
      if (iniciado) return;
      iniciado = true;
      portada.style.display = "none";
      carga.style.display = "flex";
      botonCompleta.style.display = "block";
      const script = document.createElement("script");
      script.src = "Build/Web.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, {
          dataUrl: "Build/Web.data.unityweb",
          frameworkUrl: "Build/Web.framework.js.unityweb",
          codeUrl: "Build/Web.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Nexus Team",
          productName: "Nexus",
          productVersion: "1.0",
          showBanner: (msg, tipo) => { if (tipo === "error") mostrarError(msg); }
        }, (p) => {
          barra.style.width = Math.round(p * 100) + "%";
          porcentaje.textContent = "CARGANDO " + Math.round(p * 100) + " %";
        }).then(() => {
          carga.style.display = "none";
          canvas.focus();
        }).catch((m) => mostrarError("No se pudo iniciar el juego: " + m));
      };
      script.onerror = () => mostrarError("No se pudo descargar el juego. Revise la conexión e inténtelo de nuevo.");
      document.body.appendChild(script);
    }

    portada.onclick = iniciar;
    canvas.addEventListener("click", () => canvas.focus());
  </script>
</body>
</html>
